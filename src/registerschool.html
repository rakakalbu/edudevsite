      .suggest-box {

      .suggest-item {

      .muted {

      }
      .inline-checkbox {
        display: flex;
        align-items: center;

      .auth-card {
        max-width: 560px;
        margin: 24px auto;
        padding: 20px;

      .auth-actions {
        display: flex;

      }
      .auth-sep {
        margin: 20px 0;
        border-top: 1px dashed #e5e7eb;
      }
      .va-card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .va-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .va-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-top: 1px dashed #eee;
      }
      .va-row:first-of-type {
        border-top: none;
      }
      .value.code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
      }
      .price {
        font-weight: 700;
        font-size: 18px;
      }
    </style>

        ...

    <script src="js/registerschool-wizard.js"></script>

    <!-- 🔽 NEW SCRIPT for School Web-to-Lead Submission -->
    <script>
      (function () {
        const $ = (s, r = document) => r.querySelector(s);
        const emailOk = (e) =>
          /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(String(e || "").toLowerCase());
        const digits = (s) => String(s || "").replace(/\\D/g, "");
        function normalizePhone(raw) {
          let p = digits(raw || "");
          if (!p) return null;
          if (p.startsWith("0")) p = p.slice(1);
          if (!p.startsWith("62")) p = "62" + p;
          return "+" + p;
        }
        async function api(url, opts) {
          const res = await fetch(url, opts);
          let data = null;
          try {
            data = await res.json();
          } catch {
            throw new Error("Server returned invalid response");
          }
          if (!res.ok || data?.success === false) {
            throw new Error(data?.message || `HTTP ${res.status}`);
          }
          return data;
        }
        function showLoading(title = "Mengirim…") {
          Swal.fire({
            title,
            didOpen: () => Swal.showLoading(),
            allowOutsideClick: false,
            allowEscapeKey: false,
            showConfirmButton: false,
          });
        }
        function showError(msg) {
          Swal.fire({
            icon: "error",
            title: "Gagal",
            text: msg || "Terjadi kesalahan.",
          });
        }
        function confirmPreview(data) {
          const html = `
            <div style="text-align:left">
              <div><strong>Nama:</strong> ${data.firstName} ${
            data.lastName || ""
          }</div>
              <div><strong>Email:</strong> ${data.email}</div>
              <div><strong>Phone:</strong> ${data.phone}</div>
              <div><strong>Jenjang:</strong> ${data.educationLevel}</div>
              <div><strong>Minat khusus:</strong> ${data.description || "-"}</div>
            </div>`;
          return Swal.fire({
            title: "Kirim data ini?",
            html,
            icon: "question",
            showCancelButton: true,
            confirmButtonText: "Ya, kirim",
            cancelButtonText: "Periksa lagi",
          });
        }

        // This attaches to your Step 1 form submit as an example
        async function submitSchoolLead(payload) {
          try {
            showLoading();
            await api("/api/webtolead_school", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            Swal.close();
            Swal.fire({
              icon: "success",
              title: "Terima kasih!",
              text: "Data Anda telah dikirim. Kami akan segera menghubungi Anda.",
            }).then(() => (location.href = "thankyou.html"));
          } catch (e) {
            Swal.close();
            showError(e.message);
          }
        }

        // example: hook to final Submit button (Step 5)
        document.addEventListener("DOMContentLoaded", () => {
          const btnSubmit = $("#btnSubmitFinal");
          btnSubmit?.addEventListener("click", async () => {
            // gather data
            const firstName = $("#firstName")?.value.trim();
            const lastName = $("#lastName")?.value.trim() || "";
            const email = $("#email")?.value.trim();
            const phone = normalizePhone($("#phone")?.value);
            const educationLevel =
              document.querySelector("input[name='campus']:checked")?.value ||
              "SMP"; // fallback
            const description =
              $("#majorSelect")?.selectedOptions?.[0]?.text || "-";

            const payload = {
              firstName,
              lastName,
              email,
              phone,
              educationLevel,
              description,
              masterSchoolId: "YOUR_DEFAULT_SCHOOL_ID_HERE",
            };

            const confirm = await confirmPreview(payload);
            if (confirm.isConfirmed) await submitSchoolLead(payload);
          });
        });
      })();
    </script>
  </body>
</html>
